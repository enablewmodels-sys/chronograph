[package]
name = "chronograph-decoder"
description = "Reads a portable decoder artifact and decodes epochs without Python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = { version = "1", features = ["float_roundtrip"] }
# Verify every tensor against the digest recorded in model.json before it is used.
sha2 = "0.10"

[[bin]]
name = "chronograph-decode"
path = "src/main.rs"
