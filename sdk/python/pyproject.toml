[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chronograph-connectors"
version = "0.4.0a3"
description = "Normalized record transport and durable local spool for ChronoDB"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-PolyForm-Perimeter-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ChronoDB, Inc.", email = "enablewmodels@gmail.com" }]
keywords = ["temporal", "graph", "database", "branching", "time-travel", "connectors"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Database",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://chronodb.co"
Documentation = "https://chronodb.co/documentation/QUICKSTART"
Repository = "https://github.com/enablewmodels-sys/chronograph"
Issues = "https://github.com/enablewmodels-sys/chronograph/issues"
Changelog = "https://github.com/enablewmodels-sys/chronograph/blob/main/CHANGELOG.md"

[project.optional-dependencies]
bci = ["numpy>=2.0,<3", "scipy>=1.14,<2", "mne>=1.13,<1.14", "scikit-learn>=1.7,<2"]
bci-hardware = ["brainflow==5.22.2", "pylsl==1.18.2"]
bci-bids = ["mne-bids>=0.19,<0.20", "pybv>=0.7,<0.8"]

[project.scripts]
chronograph-bci = "chronograph_connectors.bci_cli:entry"
chronograph-agent = "chronograph_connectors.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chronograph_connectors*"]
