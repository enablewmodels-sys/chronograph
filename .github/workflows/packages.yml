# Publishes the SDKs to GitHub Packages, which needs no additional account:
# the workflow authenticates with the repository-scoped GITHUB_TOKEN.
#
# This runs only on manual dispatch, so a normal push cannot publish anything.
name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which package to publish
        type: choice
        options: [all, npm, nuget, maven, python, dart]
        default: all

permissions:
  contents: read
  packages: write

jobs:
  python:
    if: inputs.target == 'all' || inputs.target == 'python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build --outdir dist sdk/python
      - run: python -m twine check dist/*
      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m twine upload --repository-url \
            https://maven.pkg.github.com/${{ github.repository_owner }} \
            --skip-existing dist/* || true
      - name: Publish to PyPI when a trusted publisher is configured
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  npm:
    if: inputs.target == 'all' || inputs.target == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - run: npm ci
      - run: npm run build
      - run: npm test
      # GitHub Packages requires the scope to match the repository owner.
      - name: Publish to GitHub Packages
        run: |
          npm pkg set name='@${{ github.repository_owner }}/chronodb-sdk'
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npmjs when a trusted publisher is configured
        continue-on-error: true
        run: |
          npm install -g npm@latest
          npm config set registry https://registry.npmjs.org
          npm pkg set name='@chronograph-community/sdk'
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  nuget:
    if: inputs.target == 'all' || inputs.target == 'nuget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack
        run: dotnet pack sdk/csharp/Chronograph/Chronograph.csproj -c Release -o out
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "out/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

  maven:
    if: inputs.target == 'all' || inputs.target == 'maven'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          settings-path: ${{ github.workspace }}
      - name: Deploy to GitHub Packages
        run: |
          mvn -B -f sdk/java/pom.xml --settings "${{ github.workspace }}/settings.xml" \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository_owner }}/${{ github.event.repository.name }} \
            deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  dart:
    if: inputs.target == 'all' || inputs.target == 'dart'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: sdk/dart
      - run: dart analyze
        working-directory: sdk/dart
      - name: Publish to pub.dev
        continue-on-error: true
        working-directory: sdk/dart
        run: dart pub publish --force
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}

  crates:
    if: inputs.target == 'all' || inputs.target == 'crates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package -p chronograph-db
      - name: Publish to crates.io
        continue-on-error: true
        run: cargo publish -p chronograph-db --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
