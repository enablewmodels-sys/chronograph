# Publishes the SDKs to GitHub Packages, which needs no additional account:
# the workflow authenticates with the repository-scoped GITHUB_TOKEN.
#
# This runs only on manual dispatch, so a normal push cannot publish anything.
name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which package to publish
        type: choice
        options: [all, npm, nuget, maven, python, dart]
        default: all

permissions:
  contents: read
  packages: write

jobs:
  python:
    if: inputs.target == 'all' || inputs.target == 'python'
    runs-on: ubuntu-latest
    # PyPI trusted publishing exchanges an OIDC token, which needs id-token: write.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build --outdir dist sdk/python
      - run: python -m twine check dist/*
      # GitHub Packages has no Python registry, so PyPI is the only destination.
      # This succeeds silently once a trusted publisher is configured.
      - name: Publish to PyPI when a trusted publisher is configured
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  npm:
    if: inputs.target == 'all' || inputs.target == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
      - run: npm ci
      - run: npm run build
      - run: npm test
      # GitHub Packages requires the scope to match the repository owner.
      - name: Publish to GitHub Packages
        run: |
          npm pkg set name='@${{ github.repository_owner }}/chronodb-sdk'
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npmjs when a trusted publisher is configured
        continue-on-error: true
        run: |
          npm install -g npm@latest
          npm config set registry https://registry.npmjs.org
          npm pkg set name='@chronodb/sdk'
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  nuget:
    if: inputs.target == 'all' || inputs.target == 'nuget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack
        run: dotnet pack sdk/csharp/Chronograph/Chronograph.csproj -c Release -o out
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "out/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate

  maven:
    if: inputs.target == 'all' || inputs.target == 'maven'
    runs-on: ubuntu-latest
    env:
      # secrets cannot be referenced in a step-level if, so surface them here.
      MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          settings-path: ${{ github.workspace }}
      # Central needs the jar with its sources and javadoc beside it, and nothing built this POM
      # before this step existed: the conformance job compiles Client.java with javac instead.
      # It runs on every dispatch, with or without a registry credential, so 'the artifact
      # builds' is a checked fact rather than a claim.
      - name: Build the jar, its sources and its javadoc
        run: mvn -B -f sdk/java/pom.xml verify
      - name: Deploy to GitHub Packages
        run: |
          mvn -B -f sdk/java/pom.xml --settings "${{ github.workspace }}/settings.xml" \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository_owner }}/${{ github.event.repository.name }} \
            deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
      # Maven Central needs two things this repository does not hold: a verified namespace
      # (co.chronodb by DNS, or io.github.enablewmodels-sys from the GitHub account) and a Portal
      # user token. The GPG key signs the jar, its sources and its javadoc, which is what the
      # POM's release profile does. Both steps stay inert until the secrets exist.
      - name: Import the signing key
        if: env.MAVEN_CENTRAL_TOKEN != ''
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: printf %s "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Deploy to Maven Central
        if: env.MAVEN_CENTRAL_TOKEN != ''
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mkdir -p "$RUNNER_TEMP/central"
          {
            printf %s "<settings><servers><server><id>central</id><username>"
            printf %s "$MAVEN_CENTRAL_USERNAME"
            printf %s "</username><password>"
            printf %s "$MAVEN_CENTRAL_TOKEN"
            printf %s "</password></server></servers></settings>"
          } > "$RUNNER_TEMP/central/settings.xml"
          mvn -B -f sdk/java/pom.xml -Prelease \
            --settings "$RUNNER_TEMP/central/settings.xml" deploy -DskipTests

  dart:
    if: inputs.target == 'all' || inputs.target == 'dart'
    runs-on: ubuntu-latest
    env:
      # secrets cannot be referenced in a step-level if, so surface it here.
      PUB_TOKEN: ${{ secrets.PUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: sdk/dart
      - run: dart analyze
        working-directory: sdk/dart
      # pub.dev requires an account. Without a token this would sit waiting
      # for interactive authorisation and hang the job, so it only runs when the
      # secret exists.
      - name: Publish to pub.dev
        if: env.PUB_TOKEN != ''
        working-directory: sdk/dart
        run: dart pub publish --force

  crates:
    if: inputs.target == 'all' || inputs.target == 'crates'
    runs-on: ubuntu-latest
    env:
      # secrets cannot be referenced in a step-level if, so surface it here.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Both commands run whether or not a token exists: package proves the crate builds from its
      # own tarball, and the dry run is the same pre-publish validation without the upload. The
      # engine ships 16 files and its two examples live outside the crate root, so the published
      # package omits them by design and cargo says so on every run.
      - run: cargo package --locked -p chronograph-db
      - run: cargo publish --dry-run --locked -p chronograph-db
      # No continue-on-error: an upload that fails must fail the job. crates.io refuses a second
      # upload of an existing version with 409 by design, so the answer is a version bump.
      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked -p chronograph-db
