name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROPTEST_RNG_SEED: '4848215499434033153'
      CHRONOGRAPH_REPORT_PHASE: phase-ci
    steps:
      - uses: actions/checkout@v4
      # A credential-shaped string must never reach this tree, and this is the cheapest place to
      # refuse one: it needs no toolchain and it names the file it found.
      - run: python3 scripts/release/check-secrets.py
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: python3 scripts/check-phase.py phase-ci
      - run: cargo test --locked --workspace --all-features -- --test-threads=2
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: npm --prefix ui ci
      - run: npm --prefix ui run format:check
      - run: npm --prefix ui audit --audit-level=high
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
      - run: cargo install mdbook --locked --version 0.5.3
      - run: mdbook build
      - run: python3 scripts/release/check-docs.py
      - run: python3 scripts/test-production-check.py
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
      - run: node scripts/build-site.mjs
      - run: npm --prefix ui run build
      - run: node scripts/verify-ui-build.mjs ui/dist community
      - run: npm --prefix ui run build:managed
      - run: node scripts/verify-ui-build.mjs ui/dist-managed managed
      - run: cargo build --locked --release -p chronograph-server --bins
      - run: node scripts/protocol-test.mjs
      - run: node scripts/migration-client-test.mjs
      - run: node scripts/schema-test.mjs
      - run: node scripts/connector-platform-test.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - run: xvfb-run npm --prefix ui run test:e2e -- --headed
      - run: node scripts/service-latency.mjs
      - run: docker build -t chronograph:ci .
      - run: python3 scripts/container-smoke.py --image chronograph:ci
      # The evidence below is uploaded on every run, failure included, so it is checked for
      # credential-shaped bytes first: an artifact is downloadable and this is the last gate
      # before it leaves the runner.
      - run: python3 scripts/release/check-secrets.py bench/reports/v0.4.0-alpha.3/phase-ci
        if: always()
      - uses: actions/upload-artifact@v4
        # Always, not only on success. The report under bench/reports is the only readable
        # evidence a failed run leaves: the job log needs admin rights, and a run that stops at
        # the browser suite otherwise says nothing beyond "exit code 1". The paths below carry
        # no credentials — no browser traces, temporary configs or tokens are uploaded.
        if: always()
        with:
          name: verification-evidence
          path: |
            bench/reports/v0.4.0-alpha.3/phase-ci/
            /tmp/chronograph-schema-*.png
            /tmp/chronograph-landing-*.png
            /tmp/chronograph-branches-*.png
            /tmp/chronograph-branch-explorer-*.png
