name: Build unsigned Community candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-phase.py phase-native-ci
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo build --locked --release -p chronograph-server --bins
      - run: cargo install mdbook --locked --version 0.5.3
      - run: mdbook build
      - run: python3 scripts/release/package.py --target '${{ matrix.target }}'
      - run: python3 scripts/release/check-source.py dist/v0.4.0-alpha.3/chronograph-community-0.4.0-alpha.3-source.tar.gz
      - run: python3 scripts/release/smoke.py dist/v0.4.0-alpha.3/chronograph-community-0.4.0-alpha.3-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: community-${{ matrix.target }}
          path: dist/v0.4.0-alpha.3/
          retention-days: 14
# These jobs create build artifacts only. No tag, GitHub release, registry upload,
# infrastructure provision, signing identity or public deployment is configured.
