name: chronograph-comparison
services:
  neo4j:
    image: neo4j:2026.07.1
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/chronograph-benchmark
      NEO4J_server_memory_heap_initial__size: 2G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 3G
    mem_limit: 7g
    cpus: 10
    volumes:
      - ../data:/var/lib/neo4j/import:ro
      - ./load.cypher:/bench/load.cypher:ro
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p chronograph-benchmark 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
volumes:
  neo4j-data:
